<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="evaluation-pipeline-title evaluation-pipeline-desc" id="evaluation-pipeline-root"><title id="evaluation-pipeline-title">完整评估框架：双 Judge 与独立指标面板</title><desc id="evaluation-pipeline-desc">冻结逐任务评分标准；基于 Actor 可见证据评价轨迹；代码指标与 Judge 结果分栏报告。</desc><defs>
      <style>#evaluation-pipeline-root { font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; }
      #evaluation-pipeline-root .diagram-container { overflow-x:auto }
      #evaluation-pipeline-root text { font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif }</style><marker id="evaluation-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52647b" /></marker></defs><rect width="1400" height="760" fill="#ffffff" /><g transform="translate(0 -132)"><path d="M348 236 H396" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#evaluation-pipeline-arrow)" /><path d="M744 236 H804" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#evaluation-pipeline-arrow)" /><path d="M1068 316 V408" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#evaluation-pipeline-arrow)" /><path d="M348 480 H396" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#evaluation-pipeline-arrow)" /><path d="M744 476 H804" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#evaluation-pipeline-arrow)" /><path d="M464 584 V624 Q464 632 456 632 H296 Q288 632 288 640 V704" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#evaluation-pipeline-arrow)" /><path d="M704 584 V704" fill="none" stroke="#52647b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#evaluation-pipeline-arrow)" /><path d="M1280 592 V704" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#evaluation-pipeline-arrow)" /><g data-node="true"><rect x="48" y="164" width="300" height="156" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5" /><text x="68" y="200" font-size="24" fill="#243247" font-weight="600">01  任务与私有事实</text><text x="68" y="234" font-size="19" fill="#52647b" font-weight="400">Final200 Clean · 200 题</text><text x="68" y="264" font-size="19" fill="#52647b" font-weight="400">Query + 私有 TaskFacts</text><text x="68" y="294" font-size="19" fill="#52647b" font-weight="400">仅用于提取候选约束</text></g><g data-node="true"><rect x="396" y="164" width="348" height="156" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5" /><text x="416" y="200" font-size="24" fill="#243247" font-weight="600">02  代码提取候选</text><text x="416" y="234" font-size="19" fill="#52647b" font-weight="400">品类 · 品牌 · 型号 · 功能</text><text x="416" y="264" font-size="19" fill="#52647b" font-weight="400">规格 · 价格</text><text x="416" y="294" font-size="19" fill="#52647b" font-weight="400">候选 ID / 字段 / 期望值固定</text></g><g data-node="true"><rect x="804" y="164" width="548" height="152" rx="8" fill="#f5f0ff" stroke="#8b5cf6" stroke-width="2" /><text x="824" y="200" font-size="24" fill="#243247" font-weight="600">03  DeepSeek V4 Flash · Curator</text><text x="824" y="234" font-size="19" fill="#52647b" font-weight="400">仅筛选 Query 支持的候选；去重、标注 hard / soft</text><text x="824" y="264" font-size="19" fill="#52647b" font-weight="400">校验 Schema、Query 引文与 hash；每题冻结一份</text><text x="824" y="294" font-size="19" fill="#52647b" font-weight="400">Baseline / SFT / GRPO 共享评分标准</text></g><g data-node="true"><rect x="48" y="408" width="300" height="176" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5" /><text x="68" y="444" font-size="24" fill="#243247" font-weight="600">04  Actor 环境交互</text><text x="68" y="478" font-size="19" fill="#52647b" font-weight="400">Query 输入（无私有事实）</text><text x="68" y="508" font-size="19" fill="#52647b" font-weight="400">模型 ↔ 增强 Harness</text><text x="68" y="538" font-size="19" fill="#52647b" font-weight="400">↔ ShopSimulator</text><text x="68" y="568" font-size="19" fill="#52647b" font-weight="400">保存可见轨迹 / 终局</text></g><g data-node="true"><rect x="396" y="408" width="348" height="176" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5" /><text x="416" y="444" font-size="24" fill="#243247" font-weight="600">05  代码检查与输入盲化</text><text x="416" y="478" font-size="19" fill="#52647b" font-weight="400">硬指标：终局 / 合法性 / 重复</text><text x="416" y="508" font-size="19" fill="#52647b" font-weight="400">上下文 / 基础设施有效性</text><text x="416" y="538" font-size="19" fill="#52647b" font-weight="400">Judge 输入：可见轨迹 + 中性终局</text><text x="416" y="568" font-size="19" fill="#52647b" font-weight="400">白名单行为指标；去除答案信息</text></g><g data-node="true"><rect x="804" y="408" width="548" height="184" rx="8" fill="#f5f0ff" stroke="#8b5cf6" stroke-width="2" /><text x="824" y="444" font-size="24" fill="#243247" font-weight="600">06  DeepSeek V4 Pro · 轨迹 Judge</text><text x="824" y="478" font-size="19" fill="#52647b" font-weight="400">逐条 Rubric 判断，引用真实 event_id</text><text x="824" y="508" font-size="19" fill="#52647b" font-weight="400">搜索策略 / 候选利用 / 证据核验</text><text x="824" y="538" font-size="19" fill="#52647b" font-weight="400">决策质量 / 终止效率：各自 0 / 1 / 2 分</text><text x="824" y="568" font-size="19" fill="#52647b" font-weight="400">校验 Schema、rubric_id、event_id 与请求 hash</text></g><rect x="724" y="624" width="510" height="60" fill="#fff" /><text x="732" y="648" font-size="18" fill="#52647b" font-weight="400">基础设施无效 → not_judged，跳过 Pro</text><text x="732" y="676" font-size="18" fill="#52647b" font-weight="400">异常仍保留在固定分母中</text><g data-node="true"><rect x="48" y="704" width="1304" height="156" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5" /><text x="68" y="740" font-size="24" fill="#243247" font-weight="600">07  固定分母汇总 · 按 task_id 配对比较</text></g><text x="68" y="786" font-size="21" fill="#243247" font-weight="600">Reward 与终局</text><text x="68" y="822" font-size="18" fill="#52647b" font-weight="400">严格成功率 · 奖励与终止</text><text x="388" y="786" font-size="21" fill="#243247" font-weight="600">Query Rubric</text><text x="388" y="822" font-size="18" fill="#52647b" font-weight="400">逐条需求状态 · hard / soft</text><text x="716" y="786" font-size="21" fill="#243247" font-weight="600">Trajectory 轨迹质量</text><text x="716" y="822" font-size="18" fill="#52647b" font-weight="400">五维评分 · 错误类型</text><text x="1044" y="786" font-size="21" fill="#243247" font-weight="600">Deterministic 行为</text><text x="1044" y="822" font-size="18" fill="#52647b" font-weight="400">守卫 / 重复 / 环境异常</text></g></svg>
