<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="project-workflow-title project-workflow-desc" id="project-workflow-root"><title id="project-workflow-title">购物策略后训练：项目流程</title><desc id="project-workflow-desc">教师轨迹与基础模型进入课程 SFT，再通过在线 GRPO 优化动作策略。</desc><defs>
      <style>#project-workflow-root { font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; }
      #project-workflow-root .diagram-container { overflow-x:auto }
      #project-workflow-root text { font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif }</style><marker id="project-workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52647b"/></marker></defs><rect width="1400" height="720" fill="#ffffff"/><text x="48" y="60" font-size="32" fill="#243247" font-weight="700">购物策略后训练：项目流程</text><text x="48" y="100" font-size="20" fill="#52647b" font-weight="400">教师轨迹与基础模型进入课程 SFT，再通过在线 GRPO 优化动作策略。</text><path d="M304 244 H352" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#project-workflow-arrow)"/><path d="M304 432 H408 Q416 432 416 424 V372" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#project-workflow-arrow)"/><path d="M640 244 H688" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#project-workflow-arrow)"/><path d="M980 244 H1040" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#project-workflow-arrow)"/><path d="M1200 280 V396" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#project-workflow-arrow)"/><path d="M640 332 H652 Q660 332 660 340 V440 Q660 448 668 448 H1040" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#project-workflow-arrow)"/><path d="M836 548 V456 a8 8 0 0 1 0 -16 V372" fill="none" stroke="#52647b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#project-workflow-arrow)"/><path d="M1212 548 V500" fill="none" stroke="#52647b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#project-workflow-arrow)"/><g data-node="true"><rect x="48" y="176" width="256" height="160" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5"/><text x="68" y="212" font-size="24" fill="#243247" font-weight="600">教师轨迹</text><text x="68" y="246" font-size="19" fill="#52647b" font-weight="400">DeepSeek V4 Flash</text><text x="68" y="276" font-size="19" fill="#52647b" font-weight="400">1,192 个唯一任务</text><text x="68" y="306" font-size="19" fill="#52647b" font-weight="400">整理去重 · 课程划分</text></g><g data-node="true"><rect x="48" y="388" width="256" height="88" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5"/><text x="68" y="424" font-size="24" fill="#243247" font-weight="600">Qwen3.5-2B</text><text x="68" y="458" font-size="19" fill="#52647b" font-weight="400">基础模型</text></g><g data-node="true"><rect x="352" y="176" width="288" height="196" rx="8" fill="#eef5ff" stroke="#245fc1" stroke-width="2"/><text x="372" y="212" font-size="24" fill="#243247" font-weight="600">课程 LoRA SFT</text><text x="372" y="246" font-size="19" fill="#52647b" font-weight="400">动作监督 · 工具返回不计损失</text><text x="372" y="276" font-size="19" fill="#52647b" font-weight="400">A 基础执行 → B 约束核验</text><text x="372" y="306" font-size="19" fill="#52647b" font-weight="400">→ C 策略探索</text><text x="372" y="336" font-size="19" fill="#52647b" font-weight="400">C 阶段模型作为 RL 起点</text></g><g data-node="true"><rect x="688" y="176" width="292" height="196" rx="8" fill="#eef5ff" stroke="#245fc1" stroke-width="2"/><text x="708" y="212" font-size="24" fill="#243247" font-weight="600">在线 GRPO</text><text x="708" y="246" font-size="19" fill="#52647b" font-weight="400">veRL · 每个输入采样 4 条</text><text x="708" y="276" font-size="19" fill="#52647b" font-weight="400">ShopSimulator 在线交互</text><text x="708" y="306" font-size="19" fill="#52647b" font-weight="400">Reward v3 环境奖励反馈</text><text x="708" y="336" font-size="19" fill="#52647b" font-weight="400">组内比较 → 更新动作策略</text></g><g data-node="true"><rect x="1040" y="176" width="312" height="104" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5"/><text x="1060" y="212" font-size="24" fill="#243247" font-weight="600">RL450</text><text x="1060" y="246" font-size="19" fill="#52647b" font-weight="400">第 450 步策略检查点</text></g><g data-node="true"><rect x="1040" y="396" width="312" height="104" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5"/><text x="1060" y="432" font-size="24" fill="#243247" font-weight="600">Final200 Clean</text><text x="1060" y="466" font-size="19" fill="#52647b" font-weight="400">固定 200 题 · SFT / RL 对照</text></g><g data-node="true"><rect x="352" y="548" width="1000" height="96" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="1.5"/><text x="372" y="584" font-size="24" fill="#243247" font-weight="600">增强 Shopping Agent Harness</text><text x="372" y="618" font-size="19" fill="#52647b" font-weight="400">购买前检查 · 工具反馈与错误恢复 · 观察预算 · 上下文管理</text></g><text x="48" y="620" font-size="19" fill="#52647b" font-weight="600">支撑层</text><text x="48" y="676" font-size="18" fill="#52647b" font-weight="400">实线：数据与模型流转  ｜  虚线：执行框架支撑在线交互与评估</text><text x="48" y="704" font-size="18" fill="#52647b" font-weight="400">Final200 仅用于评估，不反馈训练。</text></svg>
